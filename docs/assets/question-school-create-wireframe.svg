<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">问题中学独立新建题目页低保真线框图</title>
  <desc id="desc">后台独立页面，左侧导航，右侧使用 Markdown 文本框和预览分别录入题目与可选标准答案。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .muted { fill: #667085; }
      .label { font-size: 18px; font-weight: 650; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .heading { font-size: 32px; font-weight: 720; }
      .nav { font-size: 17px; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; fill: #475467; font-size: 16px; }
    </style>
  </defs>

  <!-- Opaque canvas keeps the wireframe readable in both light and dark Markdown previews. -->
  <rect width="1280" height="900" fill="#eef2f6"/>
  <rect x="35" y="30" width="1210" height="840" rx="18" fill="#ffffff" stroke="#b8c2cf" stroke-width="2" filter="url(#shadow)"/>

  <!-- Browser chrome -->
  <rect x="35" y="30" width="1210" height="58" rx="18" fill="#e8edf3"/>
  <rect x="35" y="68" width="1210" height="20" fill="#e8edf3"/>
  <circle cx="68" cy="59" r="7" fill="#d96b64"/>
  <circle cx="92" cy="59" r="7" fill="#d6a84a"/>
  <circle cx="116" cy="59" r="7" fill="#5ca775"/>
  <rect x="168" y="45" width="720" height="28" rx="8" fill="#ffffff" stroke="#c5ced8"/>
  <text x="188" y="65" class="ui small muted">liaoqizai.site/admin/questions/new</text>

  <!-- Sidebar -->
  <rect x="35" y="88" width="225" height="782" fill="#f8fafc"/>
  <line x1="260" y1="88" x2="260" y2="870" stroke="#d4dbe4" stroke-width="2"/>
  <text x="66" y="132" class="ui label">QZ Site 后台</text>
  <text x="72" y="188" class="ui nav muted">每日三件事</text>
  <rect x="53" y="211" width="188" height="46" rx="8" fill="#dbeafe" stroke="#7aa7e8"/>
  <circle cx="76" cy="234" r="7" fill="#2563eb"/>
  <text x="94" y="240" class="ui nav" font-weight="700">问题中学</text>
  <text x="72" y="297" class="ui nav muted">智能收件箱</text>
  <text x="72" y="342" class="ui nav muted">文章</text>
  <text x="72" y="387" class="ui nav muted">Idea</text>
  <text x="72" y="432" class="ui nav muted">Todo</text>
  <text x="72" y="477" class="ui nav muted">项目管理</text>
  <text x="72" y="522" class="ui nav muted">设置</text>
  <text x="72" y="566" class="ui small muted">…其余现有入口保持不变</text>

  <!-- Main header -->
  <text x="305" y="133" class="ui small muted">问题中学 / 题库管理 / 新建题目</text>
  <text x="305" y="181" class="ui heading">新建题目</text>
  <rect x="1030" y="137" width="160" height="34" rx="17" fill="#f2f4f7" stroke="#cbd5e1"/>
  <text x="1050" y="159" class="ui small muted">独立页面 · 低保真</text>
  <text x="305" y="214" class="ui body muted">手工录入面试题；标准答案可以稍后补齐。</text>

  <!-- Question section -->
  <rect x="295" y="245" width="905" height="245" rx="12" fill="#ffffff" stroke="#b9c4d1" stroke-width="2"/>
  <text x="324" y="282" class="ui label">题目 *</text>
  <text x="390" y="282" class="ui small muted">Markdown · 最多 100,000 字符</text>

  <rect x="324" y="302" width="412" height="143" rx="8" fill="#f8fafc" stroke="#98a6b8"/>
  <text x="344" y="330" class="ui small" font-weight="650">Markdown 文本框</text>
  <line x1="344" y1="342" x2="710" y2="342" stroke="#d0d7e2"/>
  <text x="344" y="374" class="mono">请解释 Agent 工具调用的完整链路。</text>
  <text x="344" y="402" class="mono muted">可 Ctrl+V 粘贴图片</text>
  <rect x="344" y="416" width="104" height="24" rx="6" fill="#ffffff" stroke="#8ea0b5"/>
  <text x="358" y="433" class="ui small muted">上传图片</text>

  <rect x="760" y="302" width="411" height="143" rx="8" fill="#ffffff" stroke="#98a6b8"/>
  <text x="780" y="330" class="ui small" font-weight="650">预览</text>
  <line x1="780" y1="342" x2="1145" y2="342" stroke="#d0d7e2"/>
  <text x="780" y="378" class="ui body">请解释 Agent 工具调用的完整链路。</text>
  <text x="780" y="411" class="ui small muted">无富文本工具栏；按最终 Markdown 渲染。</text>

  <!-- Reference answer section -->
  <rect x="295" y="515" width="905" height="245" rx="12" fill="#ffffff" stroke="#b9c4d1" stroke-width="2"/>
  <text x="324" y="552" class="ui label">标准答案</text>
  <rect x="425" y="531" width="93" height="28" rx="14" fill="#fff7ed" stroke="#e6a85c"/>
  <text x="440" y="550" class="ui small" fill="#9a5a12">可稍后补</text>
  <text x="532" y="552" class="ui small muted">非空保存即视为本人已审核</text>

  <rect x="324" y="572" width="412" height="143" rx="8" fill="#f8fafc" stroke="#98a6b8"/>
  <text x="344" y="600" class="ui small" font-weight="650">Markdown 文本框</text>
  <line x1="344" y1="612" x2="710" y2="612" stroke="#d0d7e2"/>
  <text x="344" y="644" class="mono">1. 页面请求今日队列...</text>
  <text x="344" y="674" class="mono">2. API 返回题目，不返回答案...</text>
  <text x="344" y="704" class="ui small muted">支持粘贴 / 上传私有图片</text>

  <rect x="760" y="572" width="411" height="143" rx="8" fill="#ffffff" stroke="#98a6b8"/>
  <text x="780" y="600" class="ui small" font-weight="650">预览</text>
  <line x1="780" y1="612" x2="1145" y2="612" stroke="#d0d7e2"/>
  <text x="780" y="645" class="ui body">1. 页面请求今日队列……</text>
  <text x="780" y="677" class="ui body">2. API 仅返回题目……</text>

  <!-- Actions and state note -->
  <rect x="295" y="785" width="565" height="51" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="315" y="807" class="ui small muted">答案留空：保存为“待补答案”，不会进入今日复习。</text>
  <text x="315" y="827" class="ui small muted">答案非空：保存后立即成为可复习的新题。</text>
  <rect x="895" y="789" width="116" height="43" rx="8" fill="#ffffff" stroke="#8ea0b5"/>
  <text x="932" y="816" class="ui body">取消</text>
  <rect x="1027" y="789" width="173" height="43" rx="8" fill="#2563eb"/>
  <text x="1068" y="816" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#ffffff">保存题目</text>
</svg>
