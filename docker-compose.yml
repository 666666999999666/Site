name: qzsite

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: always
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${DB_NAME:-blog}
      POSTGRES_USER: ${DB_USER:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    pull_policy: always
    restart: always
    init: true
    mem_limit: 768m
    cpus: 1.25
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      NODE_OPTIONS: --max-old-space-size=512
      NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      INBOX_ENABLED: ${INBOX_ENABLED:-true}
      MCP_APPROVAL_TTL_HOURS: ${MCP_APPROVAL_TTL_HOURS:-24}
      MCP_IMPORT_UPLOAD_TTL_MINUTES: ${MCP_IMPORT_UPLOAD_TTL_MINUTES:-20}
      MCP_CREDENTIAL_RATE_LIMIT_PER_MINUTE: ${MCP_CREDENTIAL_RATE_LIMIT_PER_MINUTE:-60}
      MCP_SEARCH_RATE_LIMIT_PER_MINUTE: ${MCP_SEARCH_RATE_LIMIT_PER_MINUTE:-30}
      MCP_WRITE_RATE_LIMIT_PER_MINUTE: ${MCP_WRITE_RATE_LIMIT_PER_MINUTE:-10}
    volumes:
      - ./data/uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: always
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./data/uploads:/var/www/uploads:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
