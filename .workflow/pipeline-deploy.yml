version: "1.0"
name: pipeline-deploy
displayName: 构建并部署
stages:
- name: 云端 Docker 镜像构建
  displayName: 云端 Docker 镜像构建（不占用生产机）
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: build@nodejs
    name: prepare_release_dockerfile
    displayName: 固化发布提交到 Dockerfile
    nodeVersion: 14.16.0
    commands:
    - node scripts/render-release-dockerfile.mjs "${GITEE_COMMIT}" Dockerfile.release source-manifest.json
    artifacts:
    - name: RELEASE_DOCKERFILE
      path:
      - ./Dockerfile.release
      - ./source-manifest.json
    notify: []
    strategy:
      retry: "0"
  - step: build@docker
    name: build_docker
    displayName: 镜像构建
    type: account
    repository: ccr.ccs.tencentyun.com
    username: "${TCR_USERNAME}"
    password: "${TCR_PASSWORD}"
    tag: lqzzql/web:${GITEE_COMMIT}
    dockerfile: ./Dockerfile.release
    context: ""
    artifacts:
    - ${RELEASE_DOCKERFILE}
    isCache: true
    processorType:
    - amd64
    parameter: {}
    notify: []
    strategy:
      retry: "0"
    dependsOn: prepare_release_dockerfile
- name: 部署到服务器
  displayName: 生产机仅拉取并部署
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: shell@agent
    name: deploy_shell
    displayName: Shell 脚本执行
    script: |-
      set -eu
      cd /home/ubuntu/个人网站
      pipeline_commit="${GITEE_COMMIT}"
      [ "${#pipeline_commit}" -eq 40 ] || {
        echo "GITEE_COMMIT is not a full lowercase Git SHA" >&2
        exit 1
      }
      case "$pipeline_commit" in
        *[!0-9a-f]*)
          echo "GITEE_COMMIT is not a full lowercase Git SHA" >&2
          exit 1
          ;;
      esac
      expected_image="ccr.ccs.tencentyun.com/lqzzql/web:${pipeline_commit}"
      [ "${GITEE_DOCKER_IMAGE}" = "$expected_image" ] || {
        echo "Gitee image output does not match the pipeline commit" >&2
        exit 1
      }
      docker_config="$(mktemp -d /dev/shm/qzsite-docker-config.XXXXXX)"
      bootstrap=""
      cleanup() {
        set +e
        [ -z "$bootstrap" ] || rm -f -- "$bootstrap"
        DOCKER_CONFIG="$docker_config" docker logout ccr.ccs.tencentyun.com >/dev/null 2>&1 || true
        case "$docker_config" in
          /dev/shm/qzsite-docker-config.*) rm -rf -- "$docker_config" ;;
          *) echo "Refusing to remove an unexpected Docker config path" >&2 ;;
        esac
      }
      trap cleanup EXIT
      trap 'exit 129' HUP
      trap 'exit 130' INT
      trap 'exit 143' TERM
      export DOCKER_CONFIG="$docker_config"
      set +x
      printf '%s' "${TCR_PASSWORD}" | docker login ccr.ccs.tencentyun.com --username "${TCR_USERNAME}" --password-stdin >/dev/null
      set -x
      production_git_url="https://gitee.com/lqzzql/Site.git"
      production_ref="refs/remotes/gitee-production/main"
      git fetch --prune --no-tags "$production_git_url" "+refs/heads/main:$production_ref"
      target_commit="$(git rev-parse --verify "${production_ref}^{commit}")"
      [ "$target_commit" = "$pipeline_commit" ] || {
        echo "Refusing a stale pipeline deployment" >&2
        exit 1
      }
      bootstrap="$(mktemp /tmp/qzsite-deploy-entry.XXXXXX)"
      git show "${target_commit}:ops/deploy-entry.sh" > "$bootstrap"
      chmod 700 "$bootstrap"
      bash "$bootstrap" "$target_commit" "$expected_image"
    hostGroupID:
      ID: tencent-cloud
      hostID:
      - b57ee737-9ddd-4dba-bda2-0322378ea9f2
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - main
      include: []
notify: []
strategy:
  blocking: true
  stepTimeout: 90
variables:
  global:
  - TCR_USERNAME
  - TCR_PASSWORD
