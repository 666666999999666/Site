version: "1.0"
name: pipeline-deploy
displayName: 构建并部署
stages:
- name: 云端 Docker 镜像构建
  displayName: 云端 Docker 镜像构建（不占用生产机）
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: build@docker
    name: build_docker
    displayName: 镜像构建
    type: account
    repository: ccr.ccs.tencentyun.com
    username: "${TCR_USERNAME}"
    password: "${TCR_PASSWORD}"
    tag: lqzzql/web:latest
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: true
    processorType:
    - amd64
    parameter: {}
    notify: []
    strategy:
      retry: "0"
- name: 部署到服务器
  displayName: 生产机仅拉取并部署
  strategy: naturally
  trigger: auto
  executor: []
  steps:
  - step: shell@agent
    name: deploy_shell
    displayName: Shell 脚本执行
    script: |-
      set -eu
      cd /home/ubuntu/个人网站
      trap 'docker logout ccr.ccs.tencentyun.com >/dev/null 2>&1 || true' EXIT
      set +x
      printf '%s' "${TCR_PASSWORD}" | docker login ccr.ccs.tencentyun.com --username "${TCR_USERNAME}" --password-stdin >/dev/null
      set -x
      git fetch --prune origin '+refs/heads/main:refs/remotes/origin/main'
      target_commit="$(git rev-parse --verify 'origin/main^{commit}')"
      bootstrap="$(mktemp /tmp/qzsite-deploy-entry.XXXXXX)"
      trap 'rm -f -- "$bootstrap"; docker logout ccr.ccs.tencentyun.com >/dev/null 2>&1 || true' EXIT
      git show "${target_commit}:ops/deploy-entry.sh" > "$bootstrap"
      chmod 700 "$bootstrap"
      bash "$bootstrap" "$target_commit" ccr.ccs.tencentyun.com/lqzzql/web:latest
      bash ops/maintenance.sh status
    hostGroupID:
      ID: tencent-cloud
      hostID:
      - b57ee737-9ddd-4dba-bda2-0322378ea9f2
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - main
      include: []
notify: []
variables:
  global:
  - TCR_USERNAME
  - TCR_PASSWORD
