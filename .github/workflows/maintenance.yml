name: Production Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Restricted maintenance action
        required: true
        default: status
        type: choice
        options:
          - status
          - backup
          - verify-backup
          - ssl
          - content-dry-run
          - uploads-dry-run

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Run restricted maintenance command
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAINTENANCE_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: SHA256:GzQoM59zx0reV4v1xgDjIHW1bO9ctABRREQab+6PW+s
          envs: MAINTENANCE_ACTION
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /home/ubuntu/个人网站
            bash ops/maintenance.sh "$MAINTENANCE_ACTION"
