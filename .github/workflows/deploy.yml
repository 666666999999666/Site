name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_IMAGE: ccr.ccs.tencentyun.com/lqzzql/web
  DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
  SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
  NEXT_PUBLIC_SITE_URL: https://liaoqizai.site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify source
        run: |
          npm run lint
          npm test
          npx tsc --noEmit
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy and wait for health checks
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_IMAGE: ${{ env.TCR_IMAGE }}:${{ github.sha }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: SHA256:GzQoM59zx0reV4v1xgDjIHW1bO9ctABRREQab+6PW+s
          envs: DEPLOY_REVISION,DEPLOY_IMAGE,TCR_USERNAME,TCR_PASSWORD
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            trap 'docker logout ccr.ccs.tencentyun.com >/dev/null 2>&1 || true' EXIT
            printf '%s' "$TCR_PASSWORD" |
              docker login ccr.ccs.tencentyun.com --username "$TCR_USERNAME" --password-stdin >/dev/null
            cd /home/ubuntu/个人网站
            bash ops/deploy.sh "$DEPLOY_REVISION" "$DEPLOY_IMAGE"
